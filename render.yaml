services:
  # IMPORTANT: Render services have separate filesystems. The current ingestion
  # task reads uploaded_docs from disk, so production needs shared object storage
  # (for example S3/R2) or a redesign to store the upload bytes in Postgres.
  - type: web
    name: ai-knowledge-agent-app
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: ai-knowledge-agent-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false